[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sda"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk",
    "anyio",
]

[project.scripts]
sda = "sda.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
