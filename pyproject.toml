[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sda"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk",
    "anyio",
    # Terminal de doble área (entrada fija abajo, salida encima): evita que el eco
    # del teclado se entrelace con el streaming del agente (T-030).
    "prompt_toolkit",
]

[project.scripts]
sda = "sda.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sda = ["prompts/*.md", "templates/*.md", "templates/persistence/*.md"]
